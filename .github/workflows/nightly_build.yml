name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    # 00:15 am
    - cron: '15 0 * * *'

jobs:

  install_dev:
    name: Install Dev Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Clone Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Mount Cache
        uses: actions/cache@v3
        with:
          key: cache-${{ github.run_id }}
          path: |
            build
            vendor

      - name: Install Dependencies
        run: make dev -B

  # ------------------------------------------------------------------------------------------------------------------------

  syntax_checks:
    name: Syntax Checks | PHP 7.4
    needs: install_dev
    runs-on: ubuntu-latest
    steps:
      - name: Clone Code
        uses: actions/checkout@v3

      # SVRUnit has to stay installable as dev dependency in PHP 7.4 projects,
      # our own composer.lock is only for development and requires a newer PHP version
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4

      - name: PHP Syntax Checks
        run: find . -name '*.php' -not -path "./src/vendor/*" -not -path "./tests/*" | xargs -n 1 -P4 php -l

      # dev tools like PHPUnit 11 need a newer PHP version, so we resolve
      # only the dependencies that a project installing SVRUnit would get
      - name: Install Dependencies for PHP 7.4
        run: |
          rm composer.lock
          php -r '$c = json_decode(file_get_contents("composer.json"), true); unset($c["require-dev"]); file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT));'
          composer update --no-progress

      - name: Run SVRUnit with PHP 7.4
        run: php bin/svrunit list

  unit_tests:
    name: Unit Tests
    needs: install_dev
    runs-on: ubuntu-latest
    steps:

      - name: Clone Code
        uses: actions/checkout@v3

      - name: Mount Cache
        uses: actions/cache@v3
        with:
          key: cache-${{ github.run_id }}
          path: |
            build
            vendor

      - name: Run PHPUnit
        run: make phpunit -B

  phpstan:
    name: PHPStan Analyzer
    needs: install_dev
    runs-on: ubuntu-latest
    steps:

      - name: Clone Code
        uses: actions/checkout@v3

      - name: Mount Cache
        uses: actions/cache@v3
        with:
          key: cache-${{ github.run_id }}
          path: |
            build
            vendor

      - name: Run PHPStan
        run: make stan -B

  phpcsfixer:
    name: PHP CS Fixer
    needs: install_dev
    runs-on: ubuntu-latest
    steps:

      - name: Clone Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Mount Cache
        uses: actions/cache@v3
        with:
          key: cache-${{ github.run_id }}
          path: |
            build
            vendor

      - name: Run PHP CS Fixer
        run: make csfix -B

  # ------------------------------------------------------------------------------------------------------------------------

  build:
    name: Build Binaries
    needs: [ syntax_checks, unit_tests, phpstan, phpcsfixer ]
    runs-on: ubuntu-latest
    steps:
      - name: Clone Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          ini-values: phar.readonly=OFF

      - name: Mount Cache
        uses: actions/cache@v3
        with:
          key: cache-build-${{ github.run_id }}
          path: |
            build
            vendor

      - name: Build Binaries
        run: make build -B

  # ------------------------------------------------------------------------------------------------------------------------

  test_bin:
    name: E2E Tests | bin/svrunit
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:

      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Mount Cache
        uses: actions/cache@v3
        with:
          key: cache-build-${{ github.run_id }}
          path: |
            build
            vendor

      - name: Start Tests
        run: |
          cd tests/e2e && make bin -B

  test_phar:
    name: E2E Tests | svrunit.phar
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:

      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Mount Cache
        uses: actions/cache@v3
        with:
          key: cache-build-${{ github.run_id }}
          path: |
            build
            vendor

      - name: Start Tests
        run: |
          cd tests/e2e && make phar -B


  # ------------------------------------------------------------------------------------------------------------------------

  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: [ test_bin, test_phar ]
    steps:

      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Mount Cache
        uses: actions/cache@v3
        with:
          key: cache-build-${{ github.run_id }}
          path: |
            build
            vendor

      - name: Build Release ZIP file
        run: make release -B

      - name: Show Files
        run: |
          pwd
          ls -la ./build

      - name: Deployment to Server
        uses: bayssmekanique/action-simple-file-upload@v1
        with:
          host: ${{ secrets.SSH_PROD_HOST }}
          user: ${{ secrets.SSH_PROD_USER }}
          password: ${{ secrets.SSH_PROD_PWD }}
          src: ./build/svrunit.zip
          dest: ${{ secrets.PROD_DOWNLOAD_DIR }}/svrunit-nightly.zip
